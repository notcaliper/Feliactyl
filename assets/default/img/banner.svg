<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Abstract geometric shapes -->
  <g opacity="0.1">
    <circle cx="100" cy="80" r="150" fill="#6366f1"/>
    <circle cx="1100" cy="320" r="200" fill="#a855f7"/>
    <circle cx="600" cy="50" r="100" fill="#8b5cf6"/>
  </g>
  
  <!-- Grid pattern -->
  <g stroke="#6366f1" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>
  
  <!-- Central cat face - stylized and minimal -->
  <g transform="translate(600, 200)" filter="url(#glow)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5"/>
    
    <!-- Main face shape -->
    <ellipse cx="0" cy="10" rx="95" ry="85" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="3"/>
    
    <!-- Ears -->
    <path d="M -70 -35 L -50 -90 L -25 -45 Z" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 70 -35 L 50 -90 L 25 -45 Z" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Inner ears -->
    <path d="M -58 -50 L -50 -75 L -38 -48 Z" fill="#6366f1" opacity="0.5"/>
    <path d="M 58 -50 L 50 -75 L 38 -48 Z" fill="#6366f1" opacity="0.5"/>
    
    <!-- Eyes - glowing -->
    <ellipse cx="-35" cy="0" rx="18" ry="22" fill="#818cf8" filter="url(#softGlow)"/>
    <ellipse cx="35" cy="0" rx="18" ry="22" fill="#818cf8" filter="url(#softGlow)"/>
    <ellipse cx="-35" cy="0" rx="12" ry="16" fill="#0f0f1a"/>
    <ellipse cx="35" cy="0" rx="12" ry="16" fill="#0f0f1a"/>
    <circle cx="-32" cy="-5" r="5" fill="white" opacity="0.8"/>
    <circle cx="38" cy="-5" r="5" fill="white" opacity="0.8"/>
    
    <!-- Nose -->
    <path d="M -8 25 L 8 25 L 0 35 Z" fill="#f472b6" filter="url(#softGlow)"/>
    
    <!-- Subtle mouth -->
    <path d="M -15 40 Q 0 48 15 40" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Whiskers - stylized -->
    <line x1="-50" y1="25" x2="-85" y2="20" stroke="#6366f1" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="-50" y1="35" x2="-85" y2="35" stroke="#6366f1" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="25" x2="85" y2="20" stroke="#6366f1" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="35" x2="85" y2="35" stroke="#6366f1" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <g transform="translate(250, 200)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <!-- Dots -->
    <circle cx="-60" cy="0" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="60" cy="0" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="0" cy="-60" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="0" cy="60" r="3" fill="#6366f1" opacity="0.5"/>
  </g>
  
  <g transform="translate(950, 200)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <!-- Dots -->
    <circle cx="-60" cy="0" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="60" cy="0" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="0" cy="-60" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="0" cy="60" r="3" fill="#6366f1" opacity="0.5"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="150" cy="100" r="2" fill="#6366f1" opacity="0.6"/>
  <circle cx="1050" cy="300" r="2" fill="#a855f7" opacity="0.6"/>
  <circle cx="400" cy="350" r="1.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="800" cy="50" r="1.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="200" cy="300" r="1" fill="#6366f1" opacity="0.4"/>
  <circle cx="1000" cy="100" r="1" fill="#a855f7" opacity="0.4"/>
  
  <!-- Bottom accent line -->
  <line x1="400" y1="380" x2="800" y2="380" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
</svg>
