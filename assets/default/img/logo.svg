<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)"/>
  
  <!-- Cat ears -->
  <path d="M 45 70 L 65 30 L 85 65 Z" fill="url(#grad2)" stroke="white" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 115 65 L 135 30 L 155 70 Z" fill="url(#grad2)" stroke="white" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Inner ears -->
  <path d="M 55 65 L 65 40 L 75 62 Z" fill="#6366f1"/>
  <path d="M 125 62 L 135 40 L 145 65 Z" fill="#6366f1"/>
  
  <!-- Cat face shape -->
  <ellipse cx="100" cy="110" rx="55" ry="50" fill="url(#grad2)" stroke="white" stroke-width="3"/>
  
  <!-- Eyes -->
  <ellipse cx="75" cy="100" rx="12" ry="15" fill="white"/>
  <ellipse cx="125" cy="100" rx="12" ry="15" fill="white"/>
  <ellipse cx="75" cy="100" rx="6" ry="10" fill="#1f2937"/>
  <ellipse cx="125" cy="100" rx="6" ry="10" fill="#1f2937"/>
  <circle cx="78" cy="95" r="3" fill="white"/>
  <circle cx="128" cy="95" r="3" fill="white"/>
  
  <!-- Nose -->
  <path d="M 92 125 L 108 125 L 100 135 Z" fill="#f472b6"/>
  
  <!-- Mouth -->
  <path d="M 85 138 Q 100 148 115 138" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 135 L 100 145" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <line x1="40" y1="120" x2="70" y2="125" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="38" y1="130" x2="70" y2="130" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="140" x2="70" y2="135" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <line x1="130" y1="125" x2="160" y2="120" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="130" y1="130" x2="162" y2="130" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="130" y1="135" x2="160" y2="140" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Server/hosting element - small hexagon badge -->
  <g transform="translate(145, 155)">
    <polygon points="15,0 28,8 28,23 15,31 2,23 2,8" fill="#10b981" stroke="white" stroke-width="2"/>
    <text x="15" y="20" font-size="12" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">F</text>
  </g>
</svg>
